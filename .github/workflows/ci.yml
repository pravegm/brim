name: CI

# Our only compiler: builds Brim with Xcode 27.1, runs the unit tests on an iPhone 18 Pro simulator, then captures
# demo-mode screenshots (ci/scenarios.txt) and renders the app icon.
on:
  push:
    branches: [main]
    paths:
      - "Brim/**"
      - "BrimTests/**"
      - "project.yml"
      - "ci/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      filter:
        description: "Regex of scenario names to capture"
        type: string
        default: "."

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVICE: "iPhone 18 Pro"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Brim.xcodeproj -scheme Brim \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*Brim/|Test run|Suite .* (passed|failed)|✘|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Summarise errors
        if: failure()
        run: |
          grep -E "error:|✘|failed" build.log | sort -u | head -300 > errors.txt || true
          cat errors.txt

      - name: Capture screenshots
        if: success()
        env:
          SCENARIO_FILTER: ${{ inputs.filter || '.' }}
        run: bash ci/screenshots.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            errors.txt
          if-no-files-found: ignore

      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ci-screens/
          if-no-files-found: ignore
