name: TestFlight

# Builds a signed Release of Brim with Xcode 27.1 on GitHub's Apple-silicon runner and uploads it to App Store
# Connect, where it appears in TestFlight. The founder's Mac is Intel (no Xcode 27), so this is the build route.
#
# One-time setup (founder): docs/LAUNCH-RUNBOOK.md §2. Repository secrets (the same four values Squish uses):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (the .p8 text, Admin team key), APPLE_TEAM_ID.
# The app record for com.pravegm.brim must exist in App Store Connect first.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What to test (shown in the run summary)"
        type: string
        default: ""
      check_only:
        description: "Only build an unsigned Release archive (no secrets, no upload): catches Release-only errors"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  release-check:
    if: ${{ inputs.check_only }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Archive Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Brim.xcodeproj -scheme Brim -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Brim.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee archive.log | grep -E "error:|warning: .*Brim/|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log
      - name: Check the archive
        run: |
          APP="$RUNNER_TEMP/Brim.xcarchive/Products/Applications/Brim.app"
          test -f "$APP/PrivacyInfo.xcprivacy" && plutil -lint "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :UISupportedInterfaceOrientations" "$APP/Info.plist"
          test -f "$APP/Assets.car" && echo "asset catalog present"
          # Demo/CI code must not ship: no BRIM-T demo strings in the Release binary.
          if strings "$APP/Brim" | grep -q "brimDemo"; then echo "::warning::'brimDemo' string found in the Release binary"; else echo "no demo strings in Release"; fi
          du -sh "$APP"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-log
          path: archive.log
          if-no-files-found: ignore

  upload:
    if: ${{ !inputs.check_only }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/LAUNCH-RUNBOOK.md §2."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the API key
        run: |
          umask 077
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive (Release) without creating a development certificate
        # Run 40266619846 failed: "Your account has reached the maximum number of certificates". Automatic signing on
        # an ephemeral runner creates a new Apple Development certificate every run (Squish's CI does the same, same
        # account). So the archive is not development-signed any more: first try an ad-hoc signature (keeps the
        # entitlements in the binary for the export to carry over), else archive unsigned. The App Store signature is
        # applied by the export step below with Apple's cloud-managed distribution certificate (Admin API key).
        run: |
          set -o pipefail
          common=(-project Brim.xcodeproj -scheme Brim -configuration Release -destination 'generic/platform=iOS'
                  -archivePath "$RUNNER_TEMP/Brim.xcarchive" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
                  DEVELOPMENT_TEAM="$APPLE_TEAM_ID")
          if xcodebuild archive "${common[@]}" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= \
               2>&1 | tee archive.log | grep -E "error:|warning: .*Brim/|\*\* ARCHIVE"; \
             grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log; then
            echo "ARCHIVE_MODE=adhoc" >> "$GITHUB_ENV"
          else
            echo "::warning::ad-hoc archive failed; archiving unsigned"
            rm -rf "$RUNNER_TEMP/Brim.xcarchive"
            xcodebuild archive "${common[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
              2>&1 | tee archive.log | grep -E "error:|warning: .*Brim/|\*\* ARCHIVE" || true
            grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log
            # Run 40268420116: an unsigned archive exports fine but without the Game Center entitlement (the export
            # carries over only what the archived binary's signature declares). Stamp the entitlements on with a local
            # ad-hoc signature (no certificate involved); the export then re-signs for the App Store and keeps them.
            APP="$RUNNER_TEMP/Brim.xcarchive/Products/Applications/Brim.app"
            codesign --force --sign - --timestamp=none --entitlements Brim/Brim.entitlements "$APP"
            codesign -d --entitlements :- "$APP" 2>/dev/null | grep -c "game-center" || true
            echo "ARCHIVE_MODE=unsigned+adhoc-entitlements" >> "$GITHUB_ENV"
          fi

      - name: Check the archive
        run: |
          APP="$RUNNER_TEMP/Brim.xcarchive/Products/Applications/Brim.app"
          test -f "$APP/PrivacyInfo.xcprivacy" && plutil -lint "$APP/PrivacyInfo.xcprivacy"
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          if [ "$BUILT" != "${{ github.run_number }}" ]; then
            echo "::error::CFBundleVersion is '$BUILT', not the run number ${{ github.run_number }}."
            exit 1
          fi

      - name: Export locally and check the App Store signature
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportLocal.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Brim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" -exportPath "$RUNNER_TEMP/local" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export-local.log | grep -E "error:|EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" export-local.log
          mkdir -p "$RUNNER_TEMP/ipa" && cd "$RUNNER_TEMP/ipa" && unzip -q "$RUNNER_TEMP"/local/*.ipa
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          codesign -d --entitlements :- "$APP" > ent.plist 2>/dev/null || true
          cat ent.plist
          echo "archive mode: $ARCHIVE_MODE"
          if grep -q "com.apple.developer.game-center" ent.plist; then
            echo "GC_ENT=yes" >> "$GITHUB_ENV"
          else
            echo "GC_ENT=no" >> "$GITHUB_ENV"
            echo "::warning::Game Center entitlement missing from the App Store signature (archive mode $ARCHIVE_MODE): Game Center will stay signed out in this build."
          fi

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Brim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error:|Upload|EXPORT|uploaded" || true
          grep -qE "\*\* EXPORT SUCCEEDED \*\*|Upload succeeded|Uploaded" export.log

      - name: Summary
        if: success()
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "### Uploaded Brim build ${{ github.run_number }} to App Store Connect"
            echo "Archive: $ARCHIVE_MODE (no development certificate created). Game Center entitlement in the App Store signature: $GC_ENT."
            echo "It shows up in TestFlight after Apple's processing (usually 10–30 min)."
            if [ -n "$NOTES" ]; then
              echo ""
              echo "**What to test:** $NOTES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
